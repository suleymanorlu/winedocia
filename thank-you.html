<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teşekkürler | Winedocia</title>
    <style>
        body {
            align-items: center;
            background-color: #2b2626;
            box-sizing: border-box;
            color: #ffffff;
            display: flex;
            font-family: Georgia, serif;
            justify-content: center;
            margin: 0;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
        }

        .thank-you-card {
            background-color: #3b3535;
            border-top: 4px solid #cda274;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            max-width: 650px;
            padding: 55px 35px;
        }

        h1 {
            color: #cda274;
            font-size: 2.8em;
            margin: 0 0 20px;
        }

        p {
            color: #d3d3d3;
            font-size: 1.15em;
            line-height: 1.6;
            margin: 0 0 30px;
        }

        .btn {
            background-color: #cda274;
            border-radius: 5px;
            color: #2b2626;
            display: inline-block;
            font-size: 1.1em;
            padding: 15px 30px;
            text-decoration: none;
            transition: background-color 0.3s;
        }

        .btn:hover {
            background-color: #e3b98c;
        }
    </style>
</head>
<body>
    <main class="thank-you-card">
        <h1>Mesajınız İçin Teşekkürler</h1>
        <p>Mesajınız bize başarıyla iletildi. En kısa sürede sizinle iletişime geçeceğiz.</p>
        <a href="index.html" class="btn">Siteye Dön</a>
    </main>
</body>
</html>
